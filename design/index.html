<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Overlap design prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="phone" id="app">
        <main class="screen" id="screen"></main>
        <nav class="nav" id="nav" aria-label="Main"></nav>
        <div class="scrim" id="scrim"></div>
        <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="slot-title" aria-hidden="true" inert></section>
        <section class="page" id="page" role="dialog" aria-modal="true" aria-labelledby="page-title" aria-hidden="true" inert></section>
        <div class="toast" id="toast" role="status"></div>
        <div class="sr-only" id="announce" aria-live="polite"></div>
    </div>
    <script src="core.js"></script>
    <script src="i18n.js"></script>
    <script src="app.js"></script>
</body>
</html>
